<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Olateam Bakery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <header class="header">
            <a href="index.html" class="logo">Olateam</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="breads.html" class="nav-link">Breads</a>
                <a href="cakes.html" class="nav-link">Cakes</a>
                <a href="pastries.html" class="nav-link">Pastries</a>
                <a href="story.html" class="nav-link">Story</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div class="header-actions">
                <button class="icon-btn" aria-label="Search"><i data-lucide="search"></i></button>
                <button class="icon-btn" aria-label="Cart"><i data-lucide="shopping-bag"></i></button>
                <div class="auth-actions desktop-only">
                    <a href="login.html" class="cta-btn secondary">Login</a>
                </div>
            </div>
        </header>

        <main class="auth-main" style="padding-top: 200px; background-color: var(--secondary-bg); min-height: 100vh;">
            <div class="modal-content" style="max-width: 500px; transform: none; box-shadow: var(--shadow-soft);">
                <div class="auth-header" style="text-align: center; margin-bottom: 40px;">
                    <h1 class="serif">Join the Bakery</h1>
                    <p>Start your journey with our freshly baked treats</p>
                </div>

                <form id="signupForm" class="auth-form" novalidate>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <input type="text" id="firstName" placeholder="First Name" required
                                style="width: 100%; padding: 18px 0; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); background: transparent; font-family: var(--font-body); font-size: 1.1rem;">
                            <span class="error-msg">Required.</span>
                        </div>
                        <div class="form-group">
                            <input type="text" id="lastName" placeholder="Last Name" required
                                style="width: 100%; padding: 18px 0; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); background: transparent; font-family: var(--font-body); font-size: 1.1rem;">
                            <span class="error-msg">Required.</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email Address" required
                            style="width: 100%; padding: 18px 0; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); background: transparent; font-family: var(--font-body); font-size: 1.1rem;">
                        <span class="error-msg">Please enter a valid email.</span>
                    </div>

                    <div class="form-group">
                        <div class="password-wrapper" style="position: relative;">
                            <input type="password" id="password" placeholder="Create Password" required
                                style="width: 100%; padding: 18px 0; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); background: transparent; font-family: var(--font-body); font-size: 1.1rem;">
                            <button type="button" class="toggle-password"
                                style="position: absolute; right: 0; top: 18px; background: none; border: none; cursor: pointer; color: var(--text-muted);"
                                aria-label="Toggle password visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" style="margin-top: 10px;">
                            <div class="strength-bar" style="height: 4px; background: #eee; border-radius: 2px;"></div>
                            <span class="strength-text" style="font-size: 0.8rem; color: var(--text-muted);">Password
                                Strength</span>
                        </div>
                        <span class="error-msg">Must be 8+ chars with a number.</span>
                    </div>

                    <div class="form-options" style="margin: 20px 0 40px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" required style="accent-color: var(--accent-primary);">
                            <span>I agree to the <a href="#"
                                    style="color: var(--accent-primary); text-decoration: none;">Terms &
                                    Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="cta-btn primary full-width">Create Account</button>
                </form>

                <div class="auth-footer" style="text-align: center; margin-top: 30px;">
                    <p>Already have an account? <a href="login.html"
                            style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Login
                            here</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
